name: Closed-beta staging database

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan, apply, or independently verify the staging migrations
        required: true
        type: choice
        options:
          - plan
          - apply
          - verify
      expected_sha:
        description: Exact full lowercase SHA currently selected on main
        required: true
        type: string
      validated_ci_run_id:
        description: Successful push/main CI run ID for expected_sha
        required: true
        type: string
      apply_confirmation:
        description: For apply only, type APPLY-EXACT-STAGING-MIGRATIONS
        required: false
        type: string
      backup_run_id:
        description: Qualified B6.02 run ID; leave all backup inputs empty only for fresh-empty
        required: false
        type: string
      backup_artifact_id:
        description: Exact qualified B6.02 artifact ID
        required: false
        type: string
      backup_artifact_digest:
        description: Exact lowercase SHA-256 returned by the B6.02 upload
        required: false
        type: string
      validated_plan_run_id:
        description: For apply only, successful plan workflow run ID for the same authority
        required: false
        type: string
      validated_plan_artifact_id:
        description: For apply only, exact GEL plan artifact ID
        required: false
        type: string
      validated_plan_artifact_digest:
        description: For apply only, exact lowercase SHA-256 from upload-artifact
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  # Shared with the Storage and catalog staging patches; keep this literal identical.
  group: closed-beta-demo-staging-operations
  cancel-in-progress: false

jobs:
  staging_database:
    name: ${{ inputs.operation }} protected staging database
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      VALIDATED_CI_RUN_ID: ${{ inputs.validated_ci_run_id }}
      OPERATION: ${{ inputs.operation }}
      APPLY_CONFIRMATION: ${{ inputs.apply_confirmation }}
      BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
      BACKUP_ARTIFACT_ID: ${{ inputs.backup_artifact_id }}
      BACKUP_ARTIFACT_DIGEST: ${{ inputs.backup_artifact_digest }}
      VALIDATED_PLAN_RUN_ID: ${{ inputs.validated_plan_run_id }}
      VALIDATED_PLAN_ARTIFACT_ID: ${{ inputs.validated_plan_artifact_id }}
      VALIDATED_PLAN_ARTIFACT_DIGEST: ${{ inputs.validated_plan_artifact_digest }}
      KWABOR_ENVIRONMENT: ${{ vars.KWABOR_ENVIRONMENT }}
      KWABOR_SUPABASE_URL: ${{ vars.KWABOR_SUPABASE_URL }}
      KWABOR_SUPABASE_PROJECT_REF: ${{ vars.KWABOR_SUPABASE_PROJECT_REF }}
      KWABOR_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.KWABOR_PRODUCTION_SUPABASE_PROJECT_REF }}
      KWABOR_STAGING_PROJECT_REF_SHA256: ${{ vars.KWABOR_STAGING_PROJECT_REF_SHA256 }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Checkout the immutable dispatch revision. The runner then proves it equals expected_sha.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify guarded runner implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tools/closed-beta-staging-database.py \
            tools/test_closed_beta_staging_database.py
          python3 -B -m unittest tools.test_closed_beta_staging_database
          python3 -B tools/verify-repository-integrity.py

      - name: Fetch immutable GitHub preflight evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ci_run_json="$RUNNER_TEMP/kwabor-validated-ci-run.json"
          environment_json="$RUNNER_TEMP/kwabor-staging-environment.json"
          plan_run_json="$RUNNER_TEMP/kwabor-validated-plan-run.json"
          plan_artifact_json="$RUNNER_TEMP/kwabor-validated-plan-artifact.json"
          plan_artifact_zip="$RUNNER_TEMP/kwabor-validated-plan-artifact.zip"
          backup_run_json="$RUNNER_TEMP/kwabor-validated-backup-run.json"
          backup_artifact_json="$RUNNER_TEMP/kwabor-validated-backup-artifact.json"
          backup_artifact_zip="$RUNNER_TEMP/kwabor-validated-backup-artifact.zip"

          fetch_json() {
            local endpoint="$1"
            local destination="$2"
            local temporary="${destination}.tmp"
            if gh api --method GET \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$endpoint" > "$temporary" 2>/dev/null; then
              mv "$temporary" "$destination"
            else
              rm -f "$temporary"
              printf '{"fetchStatus":"failed"}\n' > "$destination"
            fi
          }

          fetch_id_json() {
            local resource="$1"
            local identifier="$2"
            local destination="$3"
            if [[ "$identifier" =~ ^[1-9][0-9]*$ ]]; then
              fetch_json "/repos/$GITHUB_REPOSITORY/actions/$resource/$identifier" "$destination"
            else
              printf '{"fetchStatus":"invalid-identifier"}\n' > "$destination"
            fi
          }

          fetch_id_json "runs" "$VALIDATED_CI_RUN_ID" "$ci_run_json"
          fetch_json "/repos/$GITHUB_REPOSITORY/environments/staging" "$environment_json"

          if [[ "$OPERATION" == "apply" ]]; then
            fetch_id_json "runs" "$VALIDATED_PLAN_RUN_ID" "$plan_run_json"
            fetch_id_json "artifacts" "$VALIDATED_PLAN_ARTIFACT_ID" "$plan_artifact_json"
            if [[ "$VALIDATED_PLAN_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] && \
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d.get("id") == int(sys.argv[2]) and 0 < d.get("size_in_bytes", 0) <= 134217728' \
                "$plan_artifact_json" "$VALIDATED_PLAN_ARTIFACT_ID" 2>/dev/null; then
              curl --fail --silent --show-error --location \
                --connect-timeout 15 --max-time 180 \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$VALIDATED_PLAN_ARTIFACT_ID/zip" \
                --output "$plan_artifact_zip" 2>/dev/null || rm -f "$plan_artifact_zip"
            fi
            fetch_id_json "runs" "$BACKUP_RUN_ID" "$backup_run_json"
            fetch_id_json "artifacts" "$BACKUP_ARTIFACT_ID" "$backup_artifact_json"
            if [[ "$BACKUP_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] && \
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert d.get("id") == int(sys.argv[2]) and 0 < d.get("size_in_bytes", 0) <= 2147483648' \
                "$backup_artifact_json" "$BACKUP_ARTIFACT_ID" 2>/dev/null; then
              curl --fail --silent --show-error --location \
                --connect-timeout 15 --max-time 600 \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$BACKUP_ARTIFACT_ID/zip" \
                --output "$backup_artifact_zip" 2>/dev/null || rm -f "$backup_artifact_zip"
            fi
          else
            printf '{"fetchStatus":"not-requested"}\n' > "$plan_run_json"
            printf '{"fetchStatus":"not-requested"}\n' > "$plan_artifact_json"
            printf '{"fetchStatus":"not-requested"}\n' > "$backup_run_json"
            printf '{"fetchStatus":"not-requested"}\n' > "$backup_artifact_json"
          fi

          echo "KWABOR_VALIDATED_CI_RUN_JSON=$ci_run_json" >> "$GITHUB_ENV"
          echo "KWABOR_STAGING_ENVIRONMENT_JSON=$environment_json" >> "$GITHUB_ENV"
          echo "KWABOR_VALIDATED_PLAN_RUN_JSON=$plan_run_json" >> "$GITHUB_ENV"
          echo "KWABOR_VALIDATED_PLAN_ARTIFACT_JSON=$plan_artifact_json" >> "$GITHUB_ENV"
          echo "KWABOR_VALIDATED_PLAN_ARTIFACT_ZIP=$plan_artifact_zip" >> "$GITHUB_ENV"
          echo "KWABOR_VALIDATED_BACKUP_RUN_JSON=$backup_run_json" >> "$GITHUB_ENV"
          echo "KWABOR_VALIDATED_BACKUP_ARTIFACT_JSON=$backup_artifact_json" >> "$GITHUB_ENV"
          echo "KWABOR_VALIDATED_BACKUP_ARTIFACT_ZIP=$backup_artifact_zip" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Execute fail-closed staging database operation
        shell: bash
        env:
          KWABOR_STAGING_DATABASE_URL: ${{ secrets.KWABOR_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          python3 -B tools/closed-beta-staging-database.py execute \
            --operation "$OPERATION" \
            --expected-sha "$EXPECTED_SHA" \
            --validated-ci-run-id "$VALIDATED_CI_RUN_ID" \
            --apply-confirmation "$APPLY_CONFIRMATION" \
            --backup-run-id "$BACKUP_RUN_ID" \
            --backup-artifact-id "$BACKUP_ARTIFACT_ID" \
            --backup-artifact-digest "$BACKUP_ARTIFACT_DIGEST" \
            --validated-plan-run-id "$VALIDATED_PLAN_RUN_ID" \
            --validated-plan-artifact-id "$VALIDATED_PLAN_ARTIFACT_ID" \
            --validated-plan-artifact-digest "$VALIDATED_PLAN_ARTIFACT_DIGEST" \
            --ci-run-json "$KWABOR_VALIDATED_CI_RUN_JSON" \
            --environment-json "$KWABOR_STAGING_ENVIRONMENT_JSON" \
            --plan-run-json "$KWABOR_VALIDATED_PLAN_RUN_JSON" \
            --plan-artifact-json "$KWABOR_VALIDATED_PLAN_ARTIFACT_JSON" \
            --plan-artifact-zip "$KWABOR_VALIDATED_PLAN_ARTIFACT_ZIP" \
            --backup-run-json "$KWABOR_VALIDATED_BACKUP_RUN_JSON" \
            --backup-artifact-json "$KWABOR_VALIDATED_BACKUP_ARTIFACT_JSON" \
            --backup-artifact-zip "$KWABOR_VALIDATED_BACKUP_ARTIFACT_ZIP" \
            --evidence-directory "$GITHUB_WORKSPACE/build/closed-beta-staging-database-evidence"

      - name: Upload staging database GEL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kwabor-gel-g5-staging-database-${{ inputs.operation }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/closed-beta-staging-database-evidence
          if-no-files-found: error
          retention-days: 90
