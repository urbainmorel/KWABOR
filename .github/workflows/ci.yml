name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  brand_evidence_scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.changed-files.outputs.required }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect launch asset changes
        id: changed-files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          required=false
          while IFS= read -r changed_file; do
            case "$changed_file" in
              .github/workflows/ci.yml | \
              .github/workflows/android-launch-evidence.yml | \
              androidApp/build.gradle.kts | \
              androidApp/src/main/AndroidManifest.xml | \
              androidApp/src/main/kotlin/com/kwabor/android/KwaborApplication.kt | \
              androidApp/src/main/kotlin/com/kwabor/android/LaunchSplashGuard.kt | \
              androidApp/src/main/kotlin/com/kwabor/android/MainActivity.kt | \
              androidApp/src/main/kotlin/com/kwabor/android/app/KwaborApp.kt | \
              androidApp/src/main/kotlin/com/kwabor/android/app/KwaborOnboardingRoutes.kt | \
              androidApp/src/main/kotlin/com/kwabor/android/onboarding/* | \
              androidApp/src/main/kotlin/com/kwabor/android/ui/screens/onboarding/* | \
              androidApp/src/main/res/drawable-*/kwabor_launch_mark.png | \
              androidApp/src/main/res/drawable/ic_kwabor_launch_mark.xml | \
              androidApp/src/main/res/drawable-nodpi/kwabor_launch_wordmark.png | \
              androidApp/src/main/res/raw/kwabor_intro.mp4 | \
              androidApp/src/main/res/values/colors.xml | \
              androidApp/src/main/res/values/styles.xml | \
              androidApp/src/main/res/values-v*/styles.xml | \
              gradle/libs.versions.toml | \
              kwabor_icone_app.png | \
              kwabor_2.png | \
              tools/android-screencap-raw.py | \
              tools/capture-android-launch-evidence.sh | \
              tools/capture-android-launch-evidence-with-retry.sh | \
              tools/generate-brand-assets.ps1 | \
              tools/verify-onboarding-media.py | \
              tools/verify-brand-assets.py)
                required=true
                break
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA")
          echo "required=$required" >>"$GITHUB_OUTPUT"

  launch_evidence:
    needs: brand_evidence_scope
    if: needs.brand_evidence_scope.outputs.required == 'true'
    uses: ./.github/workflows/android-launch-evidence.yml

  launch_evidence_gate:
    name: Android launch evidence gate
    if: always() && github.event_name == 'pull_request'
    needs: [brand_evidence_scope, launch_evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce scoped launch evidence
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.brand_evidence_scope.result }}
          EVIDENCE_REQUIRED: ${{ needs.brand_evidence_scope.outputs.required }}
          EVIDENCE_RESULT: ${{ needs.launch_evidence.result }}
        run: |
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "Launch evidence scope detection did not succeed: $SCOPE_RESULT" >&2
            exit 1
          fi
          if [[ "$EVIDENCE_REQUIRED" == "true" && "$EVIDENCE_RESULT" != "success" ]]; then
            echo "Required Android launch evidence did not succeed: $EVIDENCE_RESULT" >&2
            exit 1
          fi
          echo "Android launch evidence gate satisfied (required=$EVIDENCE_REQUIRED)."

  repository_media:
    name: Repository and media integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify repository integrity
        run: python3 tools/verify-repository-integrity.py

      - name: Ensure ffprobe is available
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi

      - name: Verify embedded onboarding media
        shell: bash
        env:
          ONBOARDING_MEDIA_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$ONBOARDING_MEDIA_BASE_REF" && ! "$ONBOARDING_MEDIA_BASE_REF" =~ ^0+$ ]]; then
            python3 tools/verify-onboarding-media.py --base-ref "$ONBOARDING_MEDIA_BASE_REF"
          else
            python3 tools/verify-onboarding-media.py
          fi

      - name: Verify brand asset integrity
        run: python3 tools/verify-brand-assets.py

  gradle_check:
    name: Gradle quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Quality gate
        run: ./gradlew check --build-cache --console=plain

  edge_function:
    name: Account deletion Edge Function
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: 2.9.4
          cache: true

      - name: Verify account deletion Edge Function
        working-directory: supabase/functions/account-delete
        run: |
          deno install --frozen
          deno fmt --check .
          deno lint ./*.ts
          deno check ./*.ts
          deno test core_test.ts identity_test.ts

  supabase_database:
    name: Supabase database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0
          github-token: ${{ github.token }}

      - name: Start and validate Supabase
        run: |
          supabase db start
          supabase db lint --local --schema public,app_private --level warning --fail-on warning
          supabase test db
          python3 tools/test-event-details-concurrency.py

      - name: Enforce security advisors and inspect performance
        run: |
          supabase db advisors --local --type security --level warn --fail-on warn
          supabase db advisors --local --type performance --level warn --fail-on none

      - name: Stop Supabase
        if: always()
        continue-on-error: true
        run: supabase stop --project-id KWABOR --no-backup

  ios_prepare:
    name: Prepare shared iOS artifacts
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PACKAGE_LOCK: iosApp/Kwabor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify Xcode 16.4
        shell: bash
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "16.4"

      - name: Resolve iOS packages and detect lock drift
        id: resolve_packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project iosApp/Kwabor.xcodeproj \
            -scheme Kwabor
          test -f "$PACKAGE_LOCK"

          if git diff --quiet -- "$PACKAGE_LOCK"; then
            echo "lock_changed=false" >>"$GITHUB_OUTPUT"
            echo "Package.resolved is current for Xcode 16.4."
          else
            echo "lock_changed=true" >>"$GITHUB_OUTPUT"
            git --no-pager diff -- "$PACKAGE_LOCK"
          fi

      - name: Upload regenerated iOS package lock
        if: steps.resolve_packages.outputs.lock_changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-ios-package-lock-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.PACKAGE_LOCK }}
          if-no-files-found: error
          retention-days: 7

      - name: Enforce committed iOS package lock
        shell: bash
        env:
          ARTIFACT_NAME: resolved-ios-package-lock-${{ github.sha }}-${{ github.run_attempt }}
        run: |
          if [[ "${{ steps.resolve_packages.outputs.lock_changed }}" == "true" ]]; then
            echo "::error file=$PACKAGE_LOCK::Package.resolved is stale for Xcode 16.4."
            echo "Download the regenerated lock with:"
            echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name $ARTIFACT_NAME"
          fi
          git diff --exit-code -- "$PACKAGE_LOCK"

      - name: Test pure Swift policies
        run: |
          xcrun swiftc \
            iosApp/Kwabor/Onboarding/PromoterActivationSessionMarker.swift \
            iosApp/Kwabor/Onboarding/IntroVideoPresentationStore.swift \
            iosApp/Kwabor/Onboarding/LegacyRemoteIntroCleaner.swift \
            iosApp/Kwabor/Explore/ExplorePolicies.swift \
            iosApp/Kwabor/Detail/CatalogDetailPolicies.swift \
            iosApp/Kwabor/Detail/CatalogDetailExternalURLPolicy.swift \
            iosApp/PolicyTests/main.swift \
            -o "$RUNNER_TEMP/kwabor-ios-policy-tests"
          "$RUNNER_TEMP/kwabor-ios-policy-tests"

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Test shared runtime and build XCFrameworks
        run: >-
          ./gradlew
          :shared:iosSimulatorArm64Test
          :shared:assembleSharedDebugXCFramework
          :shared:assembleSharedReleaseXCFramework
          --build-cache
          --console=plain

      - name: Package shared XCFrameworks
        shell: bash
        run: tar -C shared/build -czf "$RUNNER_TEMP/shared-xcframeworks.tar.gz" XCFrameworks

      - name: Upload shared XCFrameworks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-xcframeworks-${{ github.sha }}
          path: ${{ runner.temp }}/shared-xcframeworks.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  ios_configuration:
    name: iOS ${{ matrix.configuration }} simulator
    needs: ios_prepare
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Staging, Release]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download shared XCFrameworks
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shared-xcframeworks-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Restore shared XCFrameworks
        shell: bash
        run: |
          mkdir -p shared/build
          tar -xzf "$RUNNER_TEMP/shared-xcframeworks.tar.gz" -C shared/build
          test -d shared/build/XCFrameworks/debug/Shared.xcframework
          test -d shared/build/XCFrameworks/release/Shared.xcframework

      - name: Resolve pinned iOS packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project iosApp/Kwabor.xcodeproj \
            -scheme Kwabor \
            -onlyUsePackageVersionsFromResolvedFile
          git diff --exit-code -- \
            iosApp/Kwabor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Build iOS simulator configuration
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: |
          set -o pipefail
          log_path="$RUNNER_TEMP/xcodebuild-$CONFIGURATION.log"
          xcodebuild \
            -project iosApp/Kwabor.xcodeproj \
            -scheme Kwabor \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-$CONFIGURATION" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$log_path"
          if [[ "$CONFIGURATION" == "Debug" ]]; then
            shared_build_type=debug
          else
            shared_build_type=release
          fi
          grep -F "/XCFrameworks/$shared_build_type/Shared.xcframework" "$log_path"

  ios:
    name: iOS simulator build
    if: always()
    needs: [ios_prepare, ios_configuration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce iOS preparation and configuration matrix
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.ios_prepare.result }}
          CONFIGURATION_RESULT: ${{ needs.ios_configuration.result }}
        run: |
          if [[ "$PREPARE_RESULT" != "success" || "$CONFIGURATION_RESULT" != "success" ]]; then
            echo "iOS validation failed: prepare=$PREPARE_RESULT configurations=$CONFIGURATION_RESULT" >&2
            exit 1
          fi

  quality:
    name: quality
    if: always()
    needs:
      - launch_evidence_gate
      - repository_media
      - gradle_check
      - edge_function
      - supabase_database
      - ios
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce every quality worker
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          LAUNCH_EVIDENCE_GATE_RESULT: ${{ needs.launch_evidence_gate.result }}
          REPOSITORY_RESULT: ${{ needs.repository_media.result }}
          GRADLE_RESULT: ${{ needs.gradle_check.result }}
          EDGE_RESULT: ${{ needs.edge_function.result }}
          SUPABASE_RESULT: ${{ needs.supabase_database.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$LAUNCH_EVIDENCE_GATE_RESULT" != "success" ]]; then
            echo "Android launch evidence gate did not succeed: $LAUNCH_EVIDENCE_GATE_RESULT" >&2
            exit 1
          fi
          for result_name in REPOSITORY_RESULT GRADLE_RESULT EDGE_RESULT SUPABASE_RESULT IOS_RESULT; do
            result="${!result_name}"
            if [[ "$result" != "success" ]]; then
              echo "$result_name did not succeed: $result" >&2
              exit 1
            fi
          done
          echo "Every required KWABOR quality worker succeeded."
