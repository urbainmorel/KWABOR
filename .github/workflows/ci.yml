name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  brand_evidence_scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.changed-files.outputs.required }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect launch asset changes
        id: changed-files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          required=false
          while IFS= read -r changed_file; do
            case "$changed_file" in
              .github/workflows/ci.yml | \
              .github/workflows/android-launch-evidence.yml | \
              androidApp/build.gradle.kts | \
              androidApp/src/main/AndroidManifest.xml | \
              androidApp/src/main/kotlin/com/kwabor/android/KwaborApplication.kt | \
              androidApp/src/main/kotlin/com/kwabor/android/LaunchSplashGuard.kt | \
              androidApp/src/main/kotlin/com/kwabor/android/MainActivity.kt | \
              androidApp/src/main/kotlin/com/kwabor/android/app/KwaborApp.kt | \
              androidApp/src/main/kotlin/com/kwabor/android/app/KwaborOnboardingRoutes.kt | \
              androidApp/src/main/kotlin/com/kwabor/android/onboarding/* | \
              androidApp/src/main/kotlin/com/kwabor/android/ui/screens/onboarding/* | \
              androidApp/src/main/res/drawable-*/kwabor_launch_mark.png | \
              androidApp/src/main/res/drawable/ic_kwabor_launch_mark.xml | \
              androidApp/src/main/res/drawable-nodpi/kwabor_launch_wordmark.png | \
              androidApp/src/main/res/raw/kwabor_intro.mp4 | \
              androidApp/src/main/res/values/colors.xml | \
              androidApp/src/main/res/values/styles.xml | \
              androidApp/src/main/res/values-v*/styles.xml | \
              gradle/libs.versions.toml | \
              kwabor_icone_app.png | \
              kwabor_2.png | \
              tools/android-screencap-raw.py | \
              tools/capture-android-launch-evidence.sh | \
              tools/capture-android-launch-evidence-with-retry.sh | \
              tools/generate-brand-assets.ps1 | \
              tools/verify-onboarding-media.py | \
              tools/verify-brand-assets.py)
                required=true
                break
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA")
          echo "required=$required" >>"$GITHUB_OUTPUT"

  launch_evidence:
    needs: brand_evidence_scope
    if: needs.brand_evidence_scope.outputs.required == 'true'
    uses: ./.github/workflows/android-launch-evidence.yml

  launch_evidence_gate:
    name: Android launch evidence gate
    if: always() && github.event_name == 'pull_request'
    needs: [brand_evidence_scope, launch_evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce scoped launch evidence
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.brand_evidence_scope.result }}
          EVIDENCE_REQUIRED: ${{ needs.brand_evidence_scope.outputs.required }}
          EVIDENCE_RESULT: ${{ needs.launch_evidence.result }}
        run: |
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "Launch evidence scope detection did not succeed: $SCOPE_RESULT" >&2
            exit 1
          fi
          if [[ "$EVIDENCE_REQUIRED" == "true" && "$EVIDENCE_RESULT" != "success" ]]; then
            echo "Required Android launch evidence did not succeed: $EVIDENCE_RESULT" >&2
            exit 1
          fi
          echo "Android launch evidence gate satisfied (required=$EVIDENCE_REQUIRED)."

  quality:
    if: always()
    needs: launch_evidence_gate
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Android launch evidence gate
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          LAUNCH_EVIDENCE_GATE_RESULT: ${{ needs.launch_evidence_gate.result }}
        run: |
          if [[ "$LAUNCH_EVIDENCE_GATE_RESULT" != "success" ]]; then
            echo "Android launch evidence gate did not succeed: $LAUNCH_EVIDENCE_GATE_RESULT" >&2
            exit 1
          fi

      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Verify repository integrity
        run: python3 tools/verify-repository-integrity.py

      - name: Ensure ffprobe is available
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi

      - name: Verify embedded onboarding media
        shell: bash
        env:
          ONBOARDING_MEDIA_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$ONBOARDING_MEDIA_BASE_REF" && ! "$ONBOARDING_MEDIA_BASE_REF" =~ ^0+$ ]]; then
            python3 tools/verify-onboarding-media.py --base-ref "$ONBOARDING_MEDIA_BASE_REF"
          else
            python3 tools/verify-onboarding-media.py
          fi

      - name: Verify brand asset integrity
        run: python3 tools/verify-brand-assets.py

      - uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.2.0

      - uses: denoland/setup-deno@v2.0.4
        with:
          deno-version: 2.9.4
          cache: true

      - uses: supabase/setup-cli@v2.1.1
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Verify account deletion Edge Function
        working-directory: supabase/functions/account-delete
        run: |
          deno install --frozen
          deno fmt --check .
          deno lint *.ts
          deno check *.ts
          deno test core_test.ts identity_test.ts

      - name: Quality gate
        run: ./gradlew check

      - name: Supabase database tests
        run: |
          supabase db start
          supabase test db

      - name: Supabase event concurrency tests
        run: python3 tools/test-event-details-concurrency.py

  ios:
    name: iOS simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Xcode version
        run: xcodebuild -version

      - name: Test pure Swift policies
        run: |
          xcrun swiftc \
            iosApp/Kwabor/Onboarding/PromoterActivationSessionMarker.swift \
            iosApp/Kwabor/Onboarding/IntroVideoPresentationStore.swift \
            iosApp/Kwabor/Onboarding/LegacyRemoteIntroCleaner.swift \
            iosApp/Kwabor/Explore/ExplorePolicies.swift \
            iosApp/Kwabor/Detail/CatalogDetailPolicies.swift \
            iosApp/Kwabor/Detail/CatalogDetailExternalURLPolicy.swift \
            iosApp/PolicyTests/main.swift \
            -o "$RUNNER_TEMP/kwabor-ios-policy-tests"
          "$RUNNER_TEMP/kwabor-ios-policy-tests"

      - name: Test shared iOS runtime on simulator
        timeout-minutes: 45
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Build shared iOS XCFrameworks
        run: ./gradlew :shared:assembleSharedDebugXCFramework :shared:assembleSharedReleaseXCFramework

      - name: Resolve pinned iOS packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project iosApp/Kwabor.xcodeproj \
            -scheme Kwabor

      - name: Build every iOS simulator configuration
        run: |
          for configuration in Debug Staging Release; do
            xcodebuild \
              -project iosApp/Kwabor.xcodeproj \
              -scheme Kwabor \
              -configuration "$configuration" \
              -destination 'generic/platform=iOS Simulator' \
              -disableAutomaticPackageResolution \
              CODE_SIGNING_ALLOWED=NO \
              build
          done
