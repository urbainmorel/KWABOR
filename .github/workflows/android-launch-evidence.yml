name: Android launch evidence

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-launch-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: API ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 30
            target: google_apis
          - api-level: 31
            target: default
          - api-level: 36
            target: google_apis

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Verify brand assets
        run: python3 tools/verify-brand-assets.py

      - name: Build debug APK
        env:
          KWABOR_ENVIRONMENT: development
          KWABOR_SUPABASE_URL_DEVELOPMENT: https://example.invalid
          KWABOR_SUPABASE_PUBLISHABLE_KEY_DEVELOPMENT: brand-evidence-publishable-key
        run: ./gradlew :androidApp:assembleDebug

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture cold starts
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: false
          emulator-options: >-
            -no-window -no-snapshot -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none
          script: bash tools/capture-android-launch-evidence.sh "${{ matrix.api-level }}"

      - name: Upload launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brand-002-api-${{ matrix.api-level }}-${{ github.sha }}
          path: build/brand-evidence/api-${{ matrix.api-level }}
          if-no-files-found: error
          retention-days: 7
