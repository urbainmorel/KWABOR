name: Closed beta demo catalog database

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA whose generated catalog is being operated
        required: true
        type: string
      validated_ci_run_id:
        description: Successful push/main CI run ID for expected_sha
        required: true
        type: string
      operation:
        description: Publish, verify, or logically hide the exact demo catalog
        required: true
        type: choice
        options:
          - publish
          - verify
          - rollback
      rollback_confirmation:
        description: For rollback only, type HIDE-EXACT-DEMO-CATALOG
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: closed-beta-demo-staging-operations
  cancel-in-progress: false

jobs:
  catalog_database:
    name: ${{ inputs.operation }} demo catalog on staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      KWABOR_ENVIRONMENT: staging
      KWABOR_SUPABASE_URL: ${{ vars.KWABOR_SUPABASE_URL }}
      KWABOR_SUPABASE_PROJECT_REF: ${{ vars.KWABOR_SUPABASE_PROJECT_REF }}
      KWABOR_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.KWABOR_PRODUCTION_SUPABASE_PROJECT_REF }}
      KWABOR_STAGING_PROJECT_REF_SHA256: ${{ vars.KWABOR_STAGING_PROJECT_REF_SHA256 }}
      KWABOR_DEMO_MEDIA_BASE_URL: ${{ vars.KWABOR_DEMO_MEDIA_BASE_URL }}

    steps:
      - name: Validate exact-head input
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [[ "${{ github.repository }}" != "urbainmorel/KWABOR" ]]; then
            echo "Demo catalog database operations are restricted to the canonical repository." >&2
            exit 1
          fi
          if [[ "${{ github.ref }}" != "refs/heads/main" || "$EXPECTED_SHA" != "${{ github.sha }}" ]]; then
            echo "Demo catalog database operations may only target the selected main exact-head." >&2
            exit 1
          fi

      - name: Require protected staging Environment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "/repos/$GITHUB_REPOSITORY/environments/staging")"
          if ! jq -e '
            .name == "staging" and
            .can_admins_bypass == false and
            .deployment_branch_policy.protected_branches == true and
            .deployment_branch_policy.custom_branch_policies == false and
            any(
              .protection_rules[];
              .type == "required_reviewers" and
              .prevent_self_review == true and
              (.reviewers | length) > 0
            )
          ' <<<"$environment_json" >/dev/null; then
            echo "The staging Environment is not protected for a demo database operation." >&2
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Verify checkout and deterministic inputs
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 -B -m py_compile \
            tools/closed-beta-gel.py \
            tools/run-demo-catalog-database.py \
            tools/test_closed_beta_gel.py
          python3 -B -m unittest \
            tools.test_compile_demo_catalog_seed \
            tools.test_closed_beta_gel \
            tools.test_run_demo_catalog_database
          python3 -B tools/verify-demo-catalog.py --require-media
          python3 -B tools/build-demo-catalog-manifest.py --check
          python3 -B tools/compile-demo-catalog-seed.py --check

      - name: Verify successful push main CI provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VALIDATED_CI_RUN_ID: ${{ inputs.validated_ci_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VALIDATED_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "validated_ci_run_id must be a positive workflow run ID." >&2
            exit 1
          fi
          ci_document="$RUNNER_TEMP/validated-ci-run.json"
          gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATED_CI_RUN_ID" > "$ci_document"
          python3 -B tools/closed-beta-gel.py validate-github-run \
            --document "$ci_document" \
            --run-id "$VALIDATED_CI_RUN_ID" \
            --expected-sha "$EXPECTED_SHA" \
            --workflow-path .github/workflows/ci.yml \
            --allowed-event push \
            --output "$RUNNER_TEMP/validated-ci-provenance.json"

      - name: Guard protected staging authority
        shell: bash
        env:
          KWABOR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KWABOR_SUPABASE_SERVICE_ROLE_KEY }}
          KWABOR_STAGING_DATABASE_URL: ${{ secrets.KWABOR_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          for value in \
            "$KWABOR_SUPABASE_URL" \
            "$KWABOR_SUPABASE_PROJECT_REF" \
            "$KWABOR_PRODUCTION_SUPABASE_PROJECT_REF" \
            "$KWABOR_STAGING_PROJECT_REF_SHA256" \
            "$KWABOR_DEMO_MEDIA_BASE_URL" \
            "$KWABOR_SUPABASE_SERVICE_ROLE_KEY" \
            "$KWABOR_STAGING_DATABASE_URL"; do
            if [[ -z "$value" ]]; then
              echo "The staging Environment is missing required catalog authority." >&2
              exit 1
            fi
          done
          if [[ ! "$KWABOR_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ || ! "$KWABOR_PRODUCTION_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "The staging or production project ref is invalid." >&2
            exit 1
          fi
          if [[ "$KWABOR_SUPABASE_PROJECT_REF" == "$KWABOR_PRODUCTION_SUPABASE_PROJECT_REF" ]]; then
            echo "Staging and production project refs must be distinct." >&2
            exit 1
          fi
          if [[ ! "$KWABOR_STAGING_PROJECT_REF_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The protected staging project-ref digest is invalid." >&2
            exit 1
          fi
          actual_ref_digest="$(printf '%s' "$KWABOR_SUPABASE_PROJECT_REF" | sha256sum | cut -d' ' -f1)"
          if [[ "$actual_ref_digest" != "$KWABOR_STAGING_PROJECT_REF_SHA256" ]]; then
            echo "The staging project ref does not match its protected identity digest." >&2
            exit 1
          fi
          echo "::add-mask::$KWABOR_SUPABASE_SERVICE_ROLE_KEY"
          echo "::add-mask::$KWABOR_STAGING_DATABASE_URL"

      - name: Verify all immutable media before database operation
        if: inputs.operation != 'rollback'
        env:
          KWABOR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KWABOR_SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 -B tools/publish-demo-catalog-storage.py verify

      - name: Require rollback confirmation
        if: inputs.operation == 'rollback' && inputs.rollback_confirmation != 'HIDE-EXACT-DEMO-CATALOG'
        run: |
          echo "Rollback requires the exact confirmation phrase." >&2
          exit 1

      - name: Execute exact catalog database operation
        env:
          KWABOR_STAGING_DATABASE_URL: ${{ secrets.KWABOR_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          args=("${{ inputs.operation }}")
          if [[ "${{ inputs.operation }}" == "rollback" ]]; then
            args+=(--confirm-rollback HIDE-EXACT-DEMO-CATALOG)
          fi
          args+=(--result-json "$RUNNER_TEMP/database-operation-result.json")
          python3 -B tools/run-demo-catalog-database.py "${args[@]}"

      - name: Write and verify sanitized database GEL receipt
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VALIDATED_CI_RUN_ID: ${{ inputs.validated_ci_run_id }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          receipt_directory="$RUNNER_TEMP/kwabor-demo-database-gel"
          receipt_name="GEL-G5-DEMO-DATABASE-$OPERATION.json"
          mkdir -p "$receipt_directory"
          cp demo/catalog/v1/manifest.json "$receipt_directory/manifest.json"
          cp "$RUNNER_TEMP/validated-ci-provenance.json" \
            "$receipt_directory/CI-RUN-PROVENANCE.json"
          cp "$RUNNER_TEMP/database-operation-result.json" \
            "$receipt_directory/DATABASE-OPERATION-RESULT.json"
          python3 -B tools/closed-beta-gel.py write \
            --directory "$receipt_directory" \
            --workflow .github/workflows/closed-beta-demo-catalog.yml \
            --operation "$OPERATION" \
            --expected-sha "$EXPECTED_SHA" \
            --validated-ci-run-id "$VALIDATED_CI_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --actor "$GITHUB_ACTOR" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --ci-provenance CI-RUN-PROVENANCE.json \
            --result DATABASE-OPERATION-RESULT.json \
            --artifact manifest=manifest.json \
            --digest "stagingProjectRefSha256=$KWABOR_STAGING_PROJECT_REF_SHA256" \
            --output "$receipt_directory/$receipt_name"
          python3 -B tools/closed-beta-gel.py verify \
            --directory "$receipt_directory" \
            --evidence "$receipt_directory/$receipt_name" \
            --workflow .github/workflows/closed-beta-demo-catalog.yml \
            --operation "$OPERATION" \
            --expected-sha "$EXPECTED_SHA" \
            --validated-ci-run-id "$VALIDATED_CI_RUN_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          echo "KWABOR_DATABASE_GEL_DIRECTORY=$receipt_directory" >> "$GITHUB_ENV"

      - name: Upload sanitized database GEL receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kwabor-gel-demo-database-${{ inputs.operation }}-${{ inputs.expected_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.KWABOR_DATABASE_GEL_DIRECTORY }}
          if-no-files-found: error
          retention-days: 90
