name: Closed-beta demo Storage

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character commit SHA to publish or verify
        required: true
        type: string
      operation:
        description: Immutable publication, verification, or exact-manifest rollback
        required: true
        type: choice
        options:
          - verify
          - publish
          - rollback
      rollback_confirmation:
        description: For rollback only, type DELETE-EXACT-DEMO-MANIFEST
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: closed-beta-demo-storage-staging
  cancel-in-progress: false

jobs:
  storage:
    name: ${{ inputs.operation }} demo media on staging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      KWABOR_ENVIRONMENT: staging
      KWABOR_SUPABASE_URL: ${{ vars.KWABOR_SUPABASE_URL }}
      KWABOR_SUPABASE_PROJECT_REF: ${{ vars.KWABOR_SUPABASE_PROJECT_REF }}
      KWABOR_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.KWABOR_PRODUCTION_SUPABASE_PROJECT_REF }}
      KWABOR_STAGING_PROJECT_REF_SHA256: ${{ vars.KWABOR_STAGING_PROJECT_REF_SHA256 }}
      KWABOR_DEMO_MEDIA_BASE_URL: ${{ vars.KWABOR_DEMO_MEDIA_BASE_URL }}
    steps:
      - name: Validate exact-head request
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [[ "${{ github.repository }}" != "urbainmorel/KWABOR" ]]; then
            echo "Demo Storage is restricted to the canonical Kwabor repository." >&2
            exit 1
          fi
          if [[ "${{ github.ref }}" != "refs/heads/main" || "$EXPECTED_SHA" != "${{ github.sha }}" ]]; then
            echo "Demo Storage may only target the selected main exact-head." >&2
            exit 1
          fi

      - name: Require protected staging Environment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          environment_json="$(gh api "/repos/$GITHUB_REPOSITORY/environments/staging")"
          if ! jq -e '
            .name == "staging" and
            .can_admins_bypass == false and
            .deployment_branch_policy.protected_branches == true and
            .deployment_branch_policy.custom_branch_policies == false and
            any(
              .protection_rules[];
              .type == "required_reviewers" and
              .prevent_self_review == true and
              (.reviewers | length) > 0
            )
          ' <<<"$environment_json" >/dev/null; then
            echo "The staging Environment is not protected for a demo Storage operation." >&2
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Verify checked-out provenance
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$EXPECTED_SHA" ]]; then
            echo "Checked-out commit does not match expected_sha." >&2
            exit 1
          fi

      - name: Run local publisher gates before Supabase network access
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/publish-demo-catalog-storage.py \
            tools/test_publish_demo_catalog_storage.py
          python3 -m unittest tools.test_publish_demo_catalog_storage

      - name: Guard staging authority and credentials
        shell: bash
        env:
          KWABOR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KWABOR_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$KWABOR_SUPABASE_URL" || -z "$KWABOR_SUPABASE_PROJECT_REF" || -z "$KWABOR_PRODUCTION_SUPABASE_PROJECT_REF" || -z "$KWABOR_STAGING_PROJECT_REF_SHA256" || -z "$KWABOR_SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "The staging Environment is missing its Storage authority." >&2
            exit 1
          fi
          if [[ ! "$KWABOR_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "The staging project ref is invalid." >&2
            exit 1
          fi
          if [[ "$KWABOR_SUPABASE_URL" != "https://${KWABOR_SUPABASE_PROJECT_REF}.supabase.co" ]]; then
            echo "The Supabase URL and staging project ref do not match." >&2
            exit 1
          fi
          if [[ ! "$KWABOR_PRODUCTION_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ || "$KWABOR_SUPABASE_PROJECT_REF" == "$KWABOR_PRODUCTION_SUPABASE_PROJECT_REF" ]]; then
            echo "The staging and production project refs must be distinct." >&2
            exit 1
          fi
          if [[ ! "$KWABOR_STAGING_PROJECT_REF_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The protected staging project-ref digest is invalid." >&2
            exit 1
          fi
          actual_ref_digest="$(printf '%s' "$KWABOR_SUPABASE_PROJECT_REF" | sha256sum | cut -d' ' -f1)"
          if [[ "$actual_ref_digest" != "$KWABOR_STAGING_PROJECT_REF_SHA256" ]]; then
            echo "The staging project ref does not match its protected identity digest." >&2
            exit 1
          fi
          echo "::add-mask::$KWABOR_SUPABASE_SERVICE_ROLE_KEY"

      - name: Validate the local manifest and 180 JPEGs
        run: |
          python3 -m pip install --disable-pip-version-check --requirement tools/requirements-demo-media.txt
          python3 tools/verify-demo-catalog.py --require-media

      - name: Publish and atomically verify 180 immutable objects
        if: inputs.operation == 'publish'
        env:
          KWABOR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KWABOR_SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tools/publish-demo-catalog-storage.py publish

      - name: Verify all public objects against the manifest
        if: inputs.operation == 'verify'
        env:
          KWABOR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KWABOR_SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 tools/publish-demo-catalog-storage.py verify

      - name: Require explicit rollback confirmation
        if: inputs.operation == 'rollback' && inputs.rollback_confirmation != 'DELETE-EXACT-DEMO-MANIFEST'
        shell: bash
        run: |
          echo "Rollback requires the exact confirmation phrase." >&2
          exit 1

      - name: Remove only the 180 exact manifest paths
        if: inputs.operation == 'rollback'
        env:
          KWABOR_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.KWABOR_SUPABASE_SERVICE_ROLE_KEY }}
          KWABOR_STAGING_DATABASE_URL: ${{ secrets.KWABOR_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$KWABOR_STAGING_DATABASE_URL" || -z "$KWABOR_DEMO_MEDIA_BASE_URL" ]]; then
            echo "Storage rollback requires the protected staging database and media URL." >&2
            exit 1
          fi
          python3 -B tools/run-demo-catalog-database.py rollback \
            --confirm-rollback HIDE-EXACT-DEMO-CATALOG
          python3 -B tools/publish-demo-catalog-storage.py rollback \
            --confirm-rollback DELETE-EXACT-DEMO-MANIFEST
